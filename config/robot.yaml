# Robot shooter geometry and motor specs
# UPDATE THESE with measured values from your actual robot

shooter:
  # Where the ball leaves the shooter, in robot-frame coordinates.
  # x measured from robot center (positive = forward toward hub).
  # y measured from carpet.
  exit_height_m: 0.50                # measured 2026-05-31 (handoff/lookup_polynomial.json coefficients are baked at this height)
  exit_forward_offset_m: 0.30        # TBD - distance from robot center to exit point

  # Hood angle range (relative to horizontal at exit)
  hood_angle_min_deg: 25.0
  hood_angle_max_deg: 85.0

  # Dumper width: how far either side of the shot line a ball's CENTRE can be
  # when it leaves the robot (meters). Balls are assumed spread evenly across
  # +/- this value. A row of four 0.15 m balls touching each other would be
  # +/-0.225 m; 0.15 m is the current working estimate - measure and update.
  ball_clump_half_width_m: 0.15

# Error budget (V5 solver): the 1-sigma size of every error source the aim
# point is chosen to tolerate. These are measurable physical quantities, not
# tuning weights - replace each estimate with a measurement when you have one.
#   speed_sigma      shot-to-shot ball exit speed scatter, as a fraction of
#                    speed. Measure: film ~30 shots at one setpoint, or back it
#                    out of the landing scatter (sim shows metres per percent).
#                    0.017 has the same variance as the old "+/-3 % uniform".
#   angle_sigma_deg  shot-to-shot launch angle scatter (hood backlash, ball
#                    seating). 0.6 matches the old "+/-1 deg uniform".
#   yaw_sigma_deg    heading error of the robot when it fires.
#   range_sigma_m    error of the distance estimate (vision / odometry).
#   vortex_coeff     wake-turbulence wander of the ball in flight:
#                    sigma = coeff * T^2 meters, T = time of flight in seconds.
#                    0.04 is an order-of-magnitude estimate from knuckleball
#                    physics (Darbois Texier et al., New J. Phys. 2016), good to
#                    about a factor of two.
error_budget:
  speed_sigma: 0.017
  angle_sigma_deg: 0.6
  yaw_sigma_deg: 1.0
  range_sigma_m: 0.03
  vortex_coeff: 0.04

# V5 aim solver settings.
aim:
  # The solver finds the hood angle with the highest scoring probability, then
  # (if this is > 0) slides toward lower flywheel speed until the sigma margin
  # has dropped by this fraction. 0.03 = "keep 97 % of the best margin, take
  # the cheapest shot that does". 0 = maximum hit probability, ~3 % more speed.
  margin_concession: 0.03
  # 0 = a hex flat faces the robot (worst case along the shot line).
  hex_bearing_deg: 0.0

# LEGACY - weights of the V3.1 weighted-cost solver (src/optimizer/solve.py),
# kept so the old results stay reproducible. The V5 solver does not use them.
# V3.1 calibration (physics-derived w_tof):
#   - foam balls don't bounce off the rim → w_entry nearly off
#   - w_v_exit emphasizes energy saving (v² penalty)
#   - w_tof now reflects vortex-shedding dispersion (NOT a heuristic anymore):
#     σ_x_vortex ≈ 0.04·T² m (Darbois-Texier et al., NJP 2016, knuckleball physics)
#     w_tof = w_v · v_design² · (σ_x/R_eff)² = 3 · 49 · (0.04/0.455)² = 1.14 → use 1.1
#     (the σ_x estimate carries ±factor-2 uncertainty from the Cl' RMS range 0.05-0.10,
#      so don't over-read the significant figures)
#     within the V3.1 plateau it acts only as a tie-breaker, never dominates
#   Note: the original V3 value w_tof=200 was an ungrounded guess; it pushed the algorithm
#      into the low-arc region and amplified θ-noise dispersion
#      (d=5m hit rate 94%, spread 1.19m vs V3.1 100%/0.69m)
cost_weights:
  w_entry_angle: 1.0    # nearly off (foam ball, entry angle barely matters)
  w_v_exit: 3.0         # emphasize energy saving (v_exit² penalty)
  w_tof: 1.1            # vortex-shedding dispersion calibration (see notes above)

flywheel:
  # Main flywheel (top roller in dual-roller terms)
  diameter_m: 0.1016                 # 4 inch Colson (typical), TBD
  motor: "Kraken X60"
  motor_free_rpm: 6000
  gear_ratio: 1.0                    # flywheel_rpm = motor_rpm / gear_ratio (1.0 = direct drive)
  max_flywheel_rpm: 6000             # = motor_free_rpm / gear_ratio
  # Wheel-ball slip when in contact (0 = no slip, 1 = full slip)
  slip_factor: 0.18                  # 15-20% typical for compliant wheels on foam

hood_roller:
  # Back-plate roller on hood (bottom roller in dual-roller terms)
  diameter_m: 0.0508                 # 2 inch typical, TBD
  motor: "Kraken X60"
  motor_free_rpm: 6000
  gear_ratio: 1.0                    # TBD - gear ratio not decided yet per the mechanical team
  max_flywheel_rpm: 6000
  slip_factor: 0.18

# Operational distance range to sweep / generate lookup
# HUB is 4.03 m from alliance wall; alliance zone is 4.03 m deep.
# Big-dumper realistic shooting range = 1.5 m (close) to ~5 m (from neutral zone edge).
operating_distance_m:
  min: 1.5
  max: 5.0
  step: 0.25
